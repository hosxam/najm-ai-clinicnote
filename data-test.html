<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Data Import Test Page -€” Najm AI ClinicNote</title>
<style>
  *, *::before, *::after { box-sizing: border-box; }
  body {
    font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
    background: #0d1117; color: #c9d1d9; margin: 0; padding: 20px;
    max-width: 960px; margin: 0 auto;
  }
  h1 { color: #58a6ff; font-size: 1.5rem; border-bottom: 1px solid #21262d; padding-bottom: 8px; margin-bottom: 24px; }
  h2 { color: #79c0ff; font-size: 1.15rem; margin: 24px 0 12px; }
  .summary-grid { display: grid; grid-template-columns: auto 1fr; gap: 4px 16px; margin-bottom: 20px; }
  .summary-grid .stat { font-weight: 600; }
  .pass { color: #3fb950; font-weight: 600; } .fail { color: #f85149; font-weight: 600; }
  .warn { color: #d29922; }
  .sample { background: #161b22; border: 1px solid #30363d; border-radius: 6px; padding: 16px; margin-bottom: 16px; }
  .sample h3 { margin: 0 0 8px; color: #f0f6fc; font-size: 1rem; }
  .chip-grid { display: flex; flex-wrap: wrap; gap: 4px; margin: 4px 0 8px; }
  .chip { background: #21262d; border: 1px solid #30363d; border-radius: 4px; padding: 2px 8px; font-size: .8rem; color: #8b949e; }
  .chip-group { margin-bottom: 12px; }
  .chip-group-label { font-size: .8rem; color: #58a6ff; margin-bottom: 4px; }
  .count { color: #8b949e; font-size: .8rem; }
  #console-log { background: #161b22; border: 1px solid #30363d; border-radius: 6px; padding: 12px; font-family: monospace; font-size: .8rem; max-height: 300px; overflow-y: auto; margin-top: 20px; }
  #console-log .entry { color: #8b949e; } #console-log .error { color: #f85149; }
  .section { border: 1px solid #21262d; border-radius: 6px; padding: 12px 16px; margin-bottom: 12px; }
  .status-bar { display: flex; gap: 16px; padding: 8px 16px; border: 1px solid #30363d; border-radius: 6px; margin-bottom: 20px; font-size: .9rem; align-items: center; }
  .loading { color: #d29922; }
  table { width: 100%; border-collapse: collapse; font-size: .85rem; }
  th, td { text-align: left; padding: 4px 8px; border-bottom: 1px solid #21262d; }
  th { color: #8b949e; font-weight: 500; white-space: nowrap; }
</style>
</head>
<body>

<h1>Data Import Test Page</h1>

<div id="status-bar" class="status-bar">
  <span class="loading">Checking data...</span>
</div>

<div id="content" style="display:none">
  <h2>Counts</h2>
  <div id="counts" class="summary-grid"></div>

  <h2>Specialty Distribution</h2>
  <div id="specialty-dist"></div>

  <h2>Sample Workflow</h2>
  <div id="sample-wf" class="sample"></div>

  <h2>Search Tests</h2>
  <div id="search-tests"></div>

  <h2>Chip Group Distribution</h2>
  <table id="chip-dist"><thead><tr><th>Group</th><th>Count</th></tr></thead><tbody></tbody></table>

  <h2>Diagnosis Index Samples</h2>
  <div id="diag-samples"></div>

  <h2>Report Template Samples</h2>
  <div id="report-samples"></div>
</div>

<div id="console-log"></div>

<script src="./GENERATED_CLINICAL_DATA.js"></script>
<script>
(function() {
  var log = document.getElementById('console-log');
  function clog(msg) {
    var d = document.createElement('div');
    d.className = 'entry';
    d.textContent = '> ' + msg;
    log.appendChild(d);
  }
  function cerr(msg) {
    var d = document.createElement('div');
    d.className = 'error';
    d.textContent = '> ERROR: ' + msg;
    log.appendChild(d);
  }
  function updateStatus(status, ok) {
    var bar = document.getElementById('status-bar');
    bar.innerHTML = '<span class="' + (ok === true ? 'pass' : ok === false ? 'fail' : 'loading') + '">' + status + '</span>';
  }
  function pass(label) {
    clog('PASS: ' + label);
    return '<span class="pass">PASS</span>';
  }
  function fail(label, detail) {
    cerr(label + (detail ? ': ' + detail : ''));
    return '<span class="fail">FAIL' + (detail ? ': ' + detail : '') + '</span>';
  }

  // -”€-”€ Load data -”€-”€
  var D = window.NAJM_CLINICAL_DATA;
  if (!D) {
    updateStatus('ERROR: NAJM_CLINICAL_DATA not defined', false);
    return;
  }

  var totalFails = 0;
  var html = '';

  // -”€-”€ Render counts -”€-”€
  function countRow(label, actual, expected, entryId) {
    var ok = actual === expected;
    if (!ok) totalFails++;
    var result = ok ? pass(label) : fail(label, 'expected ' + expected + ', found ' + actual);
    html += '<div class="stat">' + label + '</div><div>' + actual + ' ' + result + '</div>';
  }

  countRow('Specialties', D.stats.specialty_count, 8);
  countRow('Workflows', D.stats.workflow_count, 80);

  var actualChips = 0;
  for (var wfId in D.chipsByWorkflow) {
    var groups = D.chipsByWorkflow[wfId];
    for (var g in groups) {
      if (Array.isArray(groups[g])) actualChips += groups[g].length;
    }
  }
  countRow('Chips', actualChips, 2923);

  countRow('Diagnosis Index Entries', D.stats.diagnosis_index_count, 321);
  countRow('Report Templates', D.stats.report_template_count, 7);
  countRow('History Layouts', D.stats.history_layout_count, 8);

  document.getElementById('counts').innerHTML = html;

  // -”€-”€ Specialty distribution -”€-”€
  html = '<table><thead><tr><th>Specialty</th><th>Workflows</th><th>History Layout ID</th></tr></thead><tbody>';
  D.specialties.forEach(function(s) {
    var layoutExists = D.historyLayouts[s.specialty_id] ? 'yes' : 'MISSING';
    if (layoutExists === 'MISSING') { totalFails++; fail('Layout missing: ' + s.specialty_id); }
    html += '<tr><td>' + s.specialty_id + '</td><td>' + s.workflow_count + '</td><td>' + layoutExists + '</td></tr>';
  });
  html += '</tbody></table>';
  document.getElementById('specialty-dist').innerHTML = html;

  // -”€-”€ Sample workflow -”€-”€
  var sampleId = 'gp-fever-urti';
  var wf = D.workflowsById[sampleId];
  if (!wf) {
    totalFails++;
    document.getElementById('sample-wf').innerHTML = '<span class="fail">Sample workflow ' + sampleId + ' not found</span>';
  } else {
    html = '<h3>' + wf.display_name + ' <span class="count">(' + wf.workflow_id + ')</span></h3>';
    html += '<div style="margin-bottom:8px;color:#8b949e;font-size:.85rem">';
    html += 'Specialty: ' + wf.specialty + ' | ';
    html += 'Layout: ' + wf.history_layout_id + ' | ';
    html += 'Total chips: ' + wf.total_chips;
    html += ' | ICD: ' + wf.icd.code + ' (' + wf.icd.label + ')';
    if (!wf.icd.verified) html += ' <span class="warn">(unverified)</span>';
    html += '</div>';

    var groups = D.chipsByWorkflow[sampleId] || {};
    for (var g in groups) {
      if (g === 'investigations') continue; // handled inline
      var chips = groups[g] || [];
      var displayGroup = g === 'relevant_negatives' ? 'negatives' : g;
      html += '<div class="chip-group"><div class="chip-group-label">' + displayGroup + ' (' + chips.length + ')</div>';
      html += '<div class="chip-grid">';
      chips.slice(0, 8).forEach(function(c) {
        html += '<span class="chip">' + c.chip_text + '</span>';
      });
      if (chips.length > 8) html += '<span class="chip">+' + (chips.length - 8) + ' more</span>';
      html += '</div></div>';
    }
    // Show investigations separately
    var inv = groups.investigations || [];
    if (inv.length > 0) {
      html += '<div class="chip-group"><div class="chip-group-label">investigations (' + inv.length + ') <span class="warn">(new group)</span></div>';
      html += '<div class="chip-grid">';
      inv.forEach(function(c) { html += '<span class="chip">' + c.chip_text + '</span>'; });
      html += '</div></div>';
    }

    // Check all required chip groups exist
    var required = ['symptoms', 'relevant_negatives', 'exam_findings', 'red_flags', 'plan_phrases', 'follow_up'];
    required.forEach(function(g) {
      if (!Array.isArray(groups[g])) {
        totalFails++;
        fail('Missing chip group "' + g + '" in ' + sampleId);
      }
    });

    document.getElementById('sample-wf').innerHTML = html;

    // Check chip count matches
    var counted = 0;
    for (var g in groups) {
      if (Array.isArray(groups[g])) counted += groups[g].length;
    }
    if (counted !== wf.total_chips) {
      totalFails++;
      fail('Chip count mismatch for ' + sampleId, 'display=' + wf.total_chips + ', counted=' + counted);
    } else {
      pass('Chip count match for ' + sampleId);
    }
  }

  // -”€-”€ Search tests -”€-”€
  html = '';
  var searchTests = [
    { query: 'fever', min: 1, label: 'Search "fever"' },
    { query: 'cough', min: 1, label: 'Search "cough"' },
    { query: 'chest pain', min: 1, label: 'Search "chest pain"' },
    { query: 'pregnancy', min: 1, label: 'Search "pregnancy"' },
    { query: 'zzzznoise', min: 0, label: 'Search "zzzznoise" (expect 0)' }
  ];

  if (D.searchIndex && typeof D.searchIndex.search === 'function') {
    html += '<div class="section">';
    searchTests.forEach(function(t) {
      var results = D.searchIndex.search(t.query);
      var ok = results.length >= t.min;
      if (!ok) totalFails++;
      var result = ok ? pass(t.label) : fail(t.label, 'expected ' + t.min + ', got ' + results.length);
      html += '<div style="margin-bottom:4px">' + t.query + ': ' + results.length + ' results ' + result;
      if (results.length > 0 && results.length <= 5) {
        html += ' <span class="count">[' + results.join(', ') + ']</span>';
      }
      html += '</div>';
    });

    // Test searchByType
    var typeResults = D.searchIndex.searchByType('diagnosis', 'Viral URTI');
    if (typeResults.length > 0) {
      pass('searchByType(diagnosis, Viral URTI)');
      html += '<div style="margin-top:4px">searchByType(diagnosis, "Viral URTI"): ' + typeResults.length + ' results <span class="count">[' + typeResults.join(', ') + ']</span></div>';
    } else {
      totalFails++;
      fail('searchByType(diagnosis, "Viral URTI")', '0 results');
    }
    html += '</div>';
  } else {
    totalFails++;
    html += '<div class="section fail">searchIndex not available</div>';
  }

  document.getElementById('search-tests').innerHTML = html;

  // -”€-”€ Chip group distribution -”€-”€
  html = '';
  var groups = D.stats.chip_group_counts || {};
  var sortedGroups = Object.keys(groups).sort();
  sortedGroups.forEach(function(g) {
    html += '<tr><td>' + g + '</td><td>' + groups[g] + '</td></tr>';
  });
  document.getElementById('chip-dist').querySelector('tbody').innerHTML = html;

  // -”€-”€ Diagnosis index samples -”€-”€
  html = '<div class="section">';
  var entries = D.diagnosisIndex || D.searchIndex.entries || [];
  html += 'Total entries: ' + entries.length + '<br><br>';
  var types = {};
  entries.slice(0, 20).forEach(function(e) {
    types[e.type] = (types[e.type] || 0) + 1;
    var wfList = e.workflow_ids.slice(0, 3).join(', ');
    html += e.type + ': "' + e.label + '" -†’ [' + wfList + (e.workflow_ids.length > 3 ? '...' : '') + ']';
    if (e.aliases && e.aliases.length > 0) html += ' <span class="count">[' + e.aliases.slice(0, 3).join(', ') + ']</span>';
    html += '<br>';
  });
  if (entries.length > 20) html += '... and ' + (entries.length - 20) + ' more entries<br>';
  html += '<br><span class="count">Entry type distribution: ';
  var first = true;
  for (var t in types) {
    if (!first) html += ', '; first = false;
    html += t + '=' + types[t] + (entries.length > 20 ? '+' : '');
  }
  html += '</span></div>';
  document.getElementById('diag-samples').innerHTML = html;

  // -”€-”€ Report template samples -”€-”€
  html = '<div class="section">';
  for (var tid in D.reportTemplates) {
    var t = D.reportTemplates[tid];
    html += '<div style="margin-bottom:8px">';
    html += '<strong>' + t.name + '</strong> <span class="count">(' + t.template_id + ', ' + t.type + ')</span><br>';
    html += 'Sections: ' + t.sections.map(function(s) { return s.display_name; }).join(' -†’ ');
    var hasDisclaimer = t.disclaimer && t.disclaimer.length > 0;
    var hasLimitations = t.sections.some(function(s) { return s.section_id === 'limitations' || s.section_id === 'review'; });
    if (!hasDisclaimer) { totalFails++; fail('Missing disclaimer in ' + t.template_id); }
    if (!hasLimitations) { totalFails++; fail('Missing limitation/review section in ' + t.template_id); }
    html += ' | Disclaimer: ' + (hasDisclaimer ? 'yes' : '<span class="fail">MISSING</span>');
    html += ' | Clinician review: ' + (hasLimitations ? 'yes' : '<span class="fail">MISSING</span>');
    html += '</div>';
  }
  html += '</div>';
  document.getElementById('report-samples').innerHTML = html;

  // -”€-”€ Final status -”€-”€
  document.getElementById('content').style.display = 'block';
  if (totalFails === 0) {
    updateStatus('All tests passed. Data bundle is ready for integration.', true);
  } else {
    updateStatus(totalFails + ' test(s) FAILED. See console log for details.', false);
  }

  clog('=== Data Import Test Complete ===');
  clog('Result: ' + (totalFails === 0 ? 'ALL PASSED' : totalFails + ' FAILED'));
})();
</script>
</body>
</html>
